<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Adding settling and diffusion losses predicts too few airborne particles in a spherical chamber</title>
  <desc id="desc">Two equal spherical chambers show a fuller airborne particle cloud for coupled wall loss and a sparser cloud for additive wall loss. The schematic exaggerates the density difference to show its direction.</desc>
  <rect width="300" height="300" rx="16" fill="#fbf2e3"/>
  <g font-family="sans-serif" font-weight="600" text-anchor="middle" fill="#233e41">
    <text x="150" y="49" font-size="23">Airborne particles</text>
    <circle cx="80" cy="145" r="64" fill="#f5f6ef" stroke="#135963" stroke-width="4"/>
    <g fill="#254c52">
      <circle cx="57" cy="105" r="5"/>
      <circle cx="80" cy="100" r="5"/>
      <circle cx="103" cy="107" r="5"/>
      <circle cx="41" cy="121" r="5"/>
      <circle cx="64" cy="123" r="5"/>
      <circle cx="87" cy="117" r="5"/>
      <circle cx="116" cy="125" r="5"/>
      <circle cx="33" cy="142" r="5"/>
      <circle cx="54" cy="140" r="5"/>
      <circle cx="75" cy="136" r="5"/>
      <circle cx="100" cy="136" r="5"/>
      <circle cx="125" cy="147" r="5"/>
      <circle cx="41" cy="162" r="5"/>
      <circle cx="64" cy="157" r="5"/>
      <circle cx="84" cy="155" r="5"/>
      <circle cx="106" cy="159" r="5"/>
      <circle cx="53" cy="179" r="5"/>
      <circle cx="75" cy="177" r="5"/>
      <circle cx="94" cy="172" r="5"/>
      <circle cx="111" cy="179" r="5"/>
      <circle cx="84" cy="191" r="5"/>
    </g>
    <circle cx="220" cy="145" r="64" fill="#f5f6ef" stroke="#135963" stroke-width="4"/>
    <g fill="#254c52">
      <circle cx="197" cy="113" r="5"/>
      <circle cx="245" cy="122" r="5"/>
      <circle cx="213" cy="139" r="5"/>
      <circle cx="254" cy="157" r="5"/>
      <circle cx="185" cy="165" r="5"/>
      <circle cx="229" cy="180" r="5"/>
    </g>
    <text x="80" y="251" font-size="21">Coupled</text>
    <text x="220" y="251" font-size="21">Additive</text>
  </g>
</svg>
