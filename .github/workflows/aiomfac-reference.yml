name: AIOMFAC reference and package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/particula-aiomfac/**'
      - 'pyproject.toml'
      - '_particula_build.py'
      - '.github/workflows/aiomfac-reference.yml'
  push:
    branches: [main]
    paths:
      - 'packages/particula-aiomfac/**'
      - 'pyproject.toml'
      - '_particula_build.py'
      - '.github/workflows/aiomfac-reference.yml'
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build ./packages/particula-aiomfac
      - run: python -m unittest discover -s packages/particula-aiomfac/tests
      - run: python packages/particula-aiomfac/tools/qualify_packages.py
  reproduce:
    runs-on: ubuntu-24.04
    env:
      FC: gfortran-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gfortran-13
      - name: Generate and check numerical references
        run: |
          ref=packages/particula-aiomfac/tools/reference.py
          python "$ref" fetch
          python "$ref" build
          python "$ref" verify
          python "$ref" fetch --offline
          python "$ref" verify
