name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main, "codex/stage-*"]
  merge_group:
    branches: [ main ]

# Stop superseded PR revisions; keep each push and merge-group check.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testing:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
         python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install pytest PyYAML Markdown pymdown-extensions jupytext build 'flit_core>=3.12,<4'
        # Native examples exercise plotting, unit conversion, and chemistry.
        python -m pip install ".[extra]"

    - name: Test package
      run: pytest -Werror -m "not slow and not performance" --durations=10

    - name: Test examples
      run: pytest examples_tests -Werror -m "not slow and not performance" --durations=10

    - name: Test repository scripts
      run: pytest scripts/tests -Werror --durations=10
