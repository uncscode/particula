name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

jobs:
  testing:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
         python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
        
    - name: Install dependencies
      run: |
        python -m pip install pytest PyYAML Markdown pymdown-extensions jupytext build 'flit_core>=3.12,<4'
        # Native examples exercise plotting, unit conversion, and chemistry.
        python -m pip install ".[extra]"

    - name: Test with pytest
      run: |
        pytest -Werror -m "not slow and not performance"
        pytest examples_tests -Werror -m "not slow and not performance"
        pytest scripts/tests -Werror
