name: Assistant plugins

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - 'scripts/build_particula_plugins.py'
      - 'scripts/tests/plugin_distribution_test.py'
      - '.github/workflows/assistant-plugins.yml'
      - 'docs/contribute/ai-assistants/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install explicit smoke-test dependencies
        run: python -m pip install . numpy==2.3.4 scipy==1.16.2 matplotlib==3.10.7 PyYAML==6.0.3 pytest==8.4.2
      - name: Check generated payload and package contracts
        run: |
          python scripts/build_particula_plugins.py --check
          python -m pytest scripts/tests/plugin_distribution_test.py -q
      - name: Test extracted npm package
        working-directory: plugins/particula-helper/opencode
        run: |
          npm ci --ignore-scripts
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/plugin-installed"
          tar -xzf "$RUNNER_TEMP"/particula-helper-opencode-*.tgz -C "$RUNNER_TEMP/plugin-installed"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/plugin-installed/package"
          PARTICULA_PLUGIN_ENTRY="$RUNNER_TEMP/plugin-installed/package/index.js" node adapter_test.mjs
      - name: Build release artifacts
        run: python scripts/build_particula_plugins.py --check --output plugin-dist
      - uses: actions/upload-artifact@v4
        with:
          name: particula-helper-distributions
          path: plugin-dist/*
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: particula-helper-distributions
          path: plugin-dist
      - name: Attach to the existing Particula release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" plugin-dist/* --clobber
