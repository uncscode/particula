name: Assistant plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'particula-helper-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
      version-increased: ${{ steps.package.outputs.version-increased }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install explicit smoke-test dependencies
        run: python -m pip install . numpy==2.3.4 scipy==1.16.2 matplotlib==3.10.7 PyYAML==6.0.3 pytest==8.4.2
      - name: Check generated payload and package contracts
        run: |
          python scripts/build_particula_plugins.py --check
          python -m pytest scripts/tests/plugin_distribution_test.py -q -Werror
      - name: Test extracted npm package
        working-directory: plugins/particula-helper/opencode
        run: |
          npm ci --ignore-scripts
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/plugin-installed"
          tar -xzf "$RUNNER_TEMP"/particula-helper-opencode-*.tgz -C "$RUNNER_TEMP/plugin-installed"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/plugin-installed/package"
          PARTICULA_PLUGIN_ENTRY="$RUNNER_TEMP/plugin-installed/package/index.js" node adapter_test.mjs
      - name: Build release artifacts
        run: python scripts/build_particula_plugins.py --check --output plugin-dist
      - name: Identify the package and version increase
        id: package
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = 'plugins/particula-helper/plugin.json'
          version = json.loads(Path(path).read_text())['version']
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          increased = False
          before = event.get('before', '')
          if (os.environ['GITHUB_EVENT_NAME'] == 'push'
                  and before and set(before) != {'0'}):
              previous = json.loads(subprocess.check_output(
                  ['git', 'show', f'{before}:{path}'], text=True))['version']
              current_parts = tuple(map(int, version.split('.')))
              previous_parts = tuple(map(int, previous.split('.')))
              if current_parts < previous_parts:
                  raise SystemExit('Plugin version must not decrease')
              increased = current_parts > previous_parts
          artifact = f"particula-helper-{version}-{os.environ['GITHUB_SHA']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'version-increased={str(increased).lower()}\n')
              output.write(f'artifact={artifact}\n')
          PY
      - name: Upload tested plugin packages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: plugin-dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Link the tested packages
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PLUGIN_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          summary = (
              f"## Particula Helper {os.environ['PLUGIN_VERSION']}\n\n"
              f"[Download tested plugin packages]({os.environ['ARTIFACT_URL']})\n\n"
              f"Source commit: `{os.environ['GITHUB_SHA']}`\n\n"
              "Includes Codex, Claude and OpenCode ZIPs, SHA256SUMS, "
              "and GITHUB-RELEASE.md with installation instructions.\n\n"
              "Artifacts are retained for 30 days. A version increase on "
              "upstream main also creates a draft GitHub release. "
              "Installed plugins require a marketplace refresh/reinstall.\n"
          )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write(summary)
          PY

  plugin-release-draft:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'uncscode/particula' &&
      needs.validate.outputs.version-increased == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: particula-helper-release-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: plugin-dist
      - name: Create an immutable draft for this plugin version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="particula-helper-v${PLUGIN_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its assets."
          else
            gh release create "$tag" plugin-dist/* \
              --draft --latest=false --target "$SOURCE_COMMIT" \
              --title "Particula Helper ${PLUGIN_VERSION}" \
              --notes-file plugin-dist/GITHUB-RELEASE.md
          fi

  release-assets:
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'particula-helper-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: plugin-dist
      - name: Attach to the existing Particula release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" plugin-dist/* --clobber
