name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install documentation dependencies
        run: |
          python -m pip install -e '.[extra]' -r website/requirements.txt pytest
          npm --prefix website ci
      - name: Test publishing infrastructure
        run: |
          npm --prefix website test
          python -m pytest scripts/tests/check_docs_structure_test.py -q --no-cov
          python scripts/check_docs_structure.py
      - name: Check saved results and changed examples
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$DOCS_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD^
          fi
          python scripts/docs_examples.py check --changed --base "$base"
      - name: Build and verify the full site
        run: npm --prefix website run build
      - name: Generate execution inventory
        run: python scripts/docs_report.py
      - name: Prepare validation reports
        run: |
          mkdir -p website/.cache/reports
          cp website/.cache/verification.json website/.cache/reports/
          cp website/migration-inventory.json website/.cache/reports/source-inventory.json
          cp website/legacy-api-anchors.json website/.cache/reports/
          cp website/.cache/execution-inventory.json website/.cache/reports/
          cp website/API_DIAGNOSTICS.md website/.cache/reports/
          cp website/MIGRATION_VALIDATION.md website/.cache/reports/
          cp .trash/mkdocs-starlight-2026-11-13/inventory.json website/.cache/reports/archive-inventory.json
          cp .trash/mkdocs-starlight-2026-11-13/README.md website/.cache/reports/rollback.md
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-validation
          path: website/.cache/reports/
          include-hidden-files: true
          retention-days: 30
      - name: Prepare production site
        if: github.repository == 'uncscode/particula' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: touch website/dist/.nojekyll
      - name: Upload production site
        if: github.repository == 'uncscode/particula' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: documentation-production
          path: website/dist/
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == 'uncscode/particula' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production-documentation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: documentation-production
          path: documentation-production
      - name: Publish verified site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: documentation-production
