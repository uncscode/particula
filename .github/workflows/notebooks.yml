name: Notebook Validation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.ipynb'
      - '.github/scripts/changed_notebooks.py'
      - '.github/scripts/validate_notebooks.py'
      - '.github/workflows/notebooks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.ipynb'
      - '.github/scripts/changed_notebooks.py'
      - '.github/scripts/validate_notebooks.py'
      - '.github/workflows/notebooks.yml'

concurrency:
  group: notebooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notebooks: ${{ steps.changed.outputs.notebooks }}
      has_changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select changed notebooks
        id: changed
        run: python .github/scripts/changed_notebooks.py

  validate-notebooks:
    needs: changed-notebooks
    if: needs.changed-notebooks.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        notebook: ${{ fromJSON(needs.changed-notebooks.outputs.notebooks) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[extra]

      - name: Install IPython kernel
        run: python -m ipykernel install --user --name python3

      - name: Validate notebook
        env:
          NOTEBOOK_PATH: ${{ matrix.notebook }}
          NOTEBOOK_TIMEOUT: 300
        run: python -u .github/scripts/validate_notebooks.py "$NOTEBOOK_PATH"
