name: Python CI and releases

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    branches: [main, "codex/stage-*"]
  merge_group:
    branches: [main]

concurrency:
  group: ci-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testing:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'particula-helper-v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
         python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install pytest PyYAML Markdown pymdown-extensions jupytext build 'flit_core>=3.12,<4'
        # Native examples exercise plotting, unit conversion, and chemistry.
        python -m pip install ".[extra]"

    - name: Test package
      run: pytest -Werror -m "not slow and not performance" --durations=10

    - name: Test examples
      run: pytest examples_tests -Werror -m "not slow and not performance" --durations=10

    - name: Test repository scripts
      run: pytest scripts/tests -Werror --durations=10

  release-plan:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'particula-helper-v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Identify an upstream library version increase
        id: plan
        run: python scripts/release.py plan

  pyping:
    needs: release-plan
    if: needs.release-plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build 'flit_core>=3.12,<4'
      - name: Build package
        run: python -m build
      - name: Verify exact release documentation bundles
        run: >-
          python scripts/check_doc_bundle.py
          --wheel dist/particula-*.whl --sdist dist/particula-*.tar.gz
          --report .artifacts/docs-bundle.json
      - name: Save documentation bundle evidence
        uses: actions/upload-artifact@v7
        with:
          name: docs-bundle
          path: .artifacts/docs-bundle.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Record checksums for the verified Python distributions
        if: needs.release-plan.outputs.publish == 'true'
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > PYTHON-SHA256SUMS
          cp ../.artifacts/docs-bundle.json .
      - name: Save exact release assets for publication and retries
        if: needs.release-plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  slow-examples:
    needs: release-plan
    if: needs.release-plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Run release-only scientific examples
        run: |
          python -m pip install ".[dev,extra]"
          python -m pytest examples_tests -Werror -m "slow and not performance" --durations=10

  validate:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'particula-helper-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
      version-increased: ${{ steps.package.outputs.version-increased }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Identify the package and version increase
        id: package
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = 'plugins/particula-helper/plugin.json'
          version = json.loads(Path(path).read_text())['version']
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          increased = False
          before = event.get('before', '')
          if (os.environ['GITHUB_EVENT_NAME'] == 'push'
                  and before and set(before) != {'0'}):
              previous = json.loads(subprocess.check_output(
                  ['git', 'show', f'{before}:{path}'], text=True))['version']
              current_parts = tuple(map(int, version.split('.')))
              previous_parts = tuple(map(int, previous.split('.')))
              if current_parts < previous_parts:
                  raise SystemExit('Plugin version must not decrease')
              increased = current_parts > previous_parts
          artifact = f"particula-helper-{version}-{os.environ['GITHUB_SHA']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'version-increased={str(increased).lower()}\n')
              output.write(f'artifact={artifact}\n')
          PY
      - name: Install explicit smoke-test dependencies
        run: python -m pip install . numpy==2.3.4 scipy==1.16.2 matplotlib==3.10.7 PyYAML==6.0.3 pytest==8.4.2
      - name: Build plugin archives and test their extracted contents
        env:
          PARTICULA_PLUGIN_DIST: ${{ github.workspace }}/plugin-dist
        run: |
          python scripts/build_particula_plugins.py --check --output plugin-dist
          python -m pytest scripts/tests/plugin_distribution_test.py::test_relocated_archives_smoke -q -Werror
      - name: Check plugin contracts before a plugin release or manual validation
        if: github.event_name == 'workflow_dispatch' || steps.package.outputs.version-increased == 'true'
        run: python -m pytest scripts/tests/plugin_distribution_test.py -q -Werror -k "not relocated_archives_smoke"
      - name: Test npm installation from the OpenCode release archive
        run: |
          (cd plugin-dist && sha256sum --strict --check SHA256SUMS)
          unzip -q plugin-dist/particula-helper-opencode.zip -d "$RUNNER_TEMP/plugin-extracted"
          npm pack "$RUNNER_TEMP/plugin-extracted/particula-helper" --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/plugin-installed"
          tar -xzf "$RUNNER_TEMP"/particula-helper-opencode-*.tgz -C "$RUNNER_TEMP/plugin-installed"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/plugin-installed/package"
          PARTICULA_PLUGIN_ENTRY="$RUNNER_TEMP/plugin-installed/package/index.js" node plugins/particula-helper/opencode/adapter_test.mjs
      - name: Upload tested plugin packages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: plugin-dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Link the tested packages
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PLUGIN_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          summary = (
              f"## Particula Helper {os.environ['PLUGIN_VERSION']}\n\n"
              f"[Download tested plugin packages]({os.environ['ARTIFACT_URL']})\n\n"
              f"Source commit: `{os.environ['GITHUB_SHA']}`\n\n"
              "Includes Codex, Claude and OpenCode ZIPs, SHA256SUMS, "
              "and GITHUB-RELEASE.md with installation instructions.\n\n"
              "Artifacts are retained for 30 days. A version increase on "
              "upstream main also publishes a GitHub release. "
              "Installed plugins require a marketplace refresh/reinstall.\n"
          )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write(summary)
          PY

  plugin-release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'uncscode/particula' &&
      needs.validate.outputs.version-increased == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: particula-helper-release-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: plugin-dist
      - name: Verify downloaded plugin archives
        working-directory: plugin-dist
        run: sha256sum --strict --check SHA256SUMS
      - name: Publish the tested packages for this plugin version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="particula-helper-v${PLUGIN_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its assets."
          else
            gh release create "$tag" plugin-dist/* \
              --latest=false --target "$SOURCE_COMMIT" \
              --title "Particula Helper ${PLUGIN_VERSION}" \
              --notes-file plugin-dist/GITHUB-RELEASE.md
          fi

  publish:
    needs: [release-plan, testing, slow-examples, pyping, validate]
    if: github.repository == 'uncscode/particula' && needs.release-plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: particula-release-${{ needs.release-plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-release-${{ github.sha }}
          path: release-assets
      - name: Download the tested plugin packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: release-assets
      - name: Verify downloaded release files
        working-directory: release-assets
        run: |
          sha256sum --strict --check PYTHON-SHA256SUMS
          sha256sum --strict --check SHA256SUMS
      - name: Verify any previously uploaded PyPI files
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: python scripts/release.py pypi-check --version "$RELEASE_VERSION"
      - name: Tag the tested commit and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/release.py github --version "$RELEASE_VERSION" --sha "$SOURCE_COMMIT"
      - name: Select the verified Python distributions
        run: |
          mkdir dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      # GITHUB_TOKEN-created releases do not trigger another release workflow.
      # Keep the existing PyPI action in this run for both automatic and manual releases.
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
