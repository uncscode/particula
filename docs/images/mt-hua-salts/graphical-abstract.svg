<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Liquid mixing increases the winter foothill growth-factor bias</title>
  <desc id="desc">Two bars measure mean predicted minus observed diameter growth factor for 18 winter foothill extracts. Using AIOMFAC pure-salt properties, additive water uptake gives +0.542. The full AIOMFAC liquid mixture gives +0.716.</desc>
  <rect width="300" height="300" rx="16" fill="#fbf2e3"/>
  <path d="M170 60l29-20 10 6 24-29 16 25 12-8 22 26z" fill="#cad9d2"/>
  <g font-family="sans-serif" fill="#243e43">
    <text x="24" y="38" font-weight="bold" font-size="22">Growth bias</text>
    <g font-size="17">
      <text x="25" y="117">Pure salts</text>
      <text x="25" y="220">Liquid mixture</text>
    </g>
    <path d="M25 119v123" stroke="#617679" stroke-width="1.5"/>

    <rect x="25" y="132" width="135.60" height="18" rx="2" fill="#243e43"/>
    <rect x="25" y="235" width="178.96" height="18" rx="2" fill="#135963"/>
  </g>
</svg>
