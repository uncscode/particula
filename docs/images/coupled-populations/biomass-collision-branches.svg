  <title id="title">How do collision models change a water-grown mixed aerosol?</title>
  <desc id="desc">One water-grown organic and soot population supplies four copies: condensation alone, or continued condensation with Brownian collisions, Brownian plus differential settling, or turbulent shear. Branches depict the comparison design.</desc>
