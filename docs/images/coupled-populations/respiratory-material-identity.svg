  <title id="title">Audit a respiratory-droplet illustration before using its predictions</title>
  <desc id="desc">The balance is level in the mass audit. The identity check fails: the retained lookup assigned hexachlorophene to the requested lysozyme. The illustration conveys a limitation in material assignment.</desc>
