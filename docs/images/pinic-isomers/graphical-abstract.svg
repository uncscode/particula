<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">A delayed source recovers most of the observed isomer timing gap</title>
  <desc id="desc">On a common time scale the measured separation between isomer half-signals is 20.7 minutes. The fitted common and delayed sources give 0.11 and 19.11 minutes at an effective particle radius of 80 nm.</desc>
  <rect width="300" height="300" rx="16" fill="#fbf2e3"/>
  <g font-family="sans-serif" fill="#243e43">
    <text x="26" y="42" font-size="24" font-weight="bold">Timing gap</text>
    <path d="M27 110V260" stroke="#617679" stroke-width="1.5"/>
    <g font-size="17">
      <text x="27" y="105">Measured</text>
      <text x="27" y="170">Common source</text>
      <text x="27" y="235">Delayed source</text>
    </g>
    <path d="M27 124H213.3" stroke="#243e43" stroke-width="6"/>
    <circle cx="213.3" cy="124" r="6" fill="#243e43"/>
    <path d="M27 189H27.99" stroke="#a44d21" stroke-width="5"/>
    <path d="M27.99 183l6 6-6 6-6-6z" fill="#a44d21"/>
    <path d="M27 254H198.99" stroke="#135963" stroke-width="5"/>
    <path d="M198.99 248l6 6-6 6-6-6z" fill="#135963"/>
  </g>
</svg>
