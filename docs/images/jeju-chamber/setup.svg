<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="871" viewBox="0 0 1152 871" role="img" aria-labelledby="title desc">
  <title id="title">Jeju expansion chamber and experiment timeline</title>
  <desc id="desc">Panel A shows the inner cloud chamber inside the outer pressure vessel. Separate pipes supply air, inject salt, and evacuate air. The bottom-mounted water-vapor analyzer, Welas optical particle counter, and cloud particle imager observe the inner chamber. Panel B follows the experimental stages and maps all four recorded data streams to the chamber fit.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#405766"/>
    </marker>
    <marker id="warm-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#a6512c"/>
    </marker>
    <marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#146e78"/>
    </marker>
    <style>
      text{font-family:"DejaVu Sans",sans-serif;fill:#152e3a}
      .title{font-weight:700;font-size:27px}
      .label{font-weight:700;font-size:16px}
      .detail{font-size:14px;fill:#485d68}
      .tiny{font-size:13px;fill:#485d68}
      .line{fill:none;stroke:#405766;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .guide{stroke:#aebdc4;stroke-width:1.3;stroke-dasharray:4 5}
      .stage{font-weight:700;font-size:15px}
      .track{font-size:14px}
    </style>
  </defs>
  <path fill="#fff" d="M0 0h1152v871H0z"/>
  <text class="title" x="35" y="45">A  ·  Korea Cloud Physics Experimental Chamber</text>
  <text class="detail" x="36" y="72">Functional section through the cloud chamber in Seogwipo, Jeju</text>

  <!-- Pressure vessel and temperature-controlled inner volume. -->
  <path d="M333 167c0-33 75-61 231-61s231 28 231 61v265c0 34-75 59-231 59s-231-25-231-59Z"
    fill="#eef2f4" stroke="#435e6b" stroke-width="3"/>
  <text class="label" x="564" y="142" text-anchor="middle">Outer pressure vessel</text>
  <path d="M401 185h326l26 26v140l-26 25H401l-26-25V211Z"
     fill="#ebf7f7" stroke="#187680" stroke-width="4"/>
  <path d="M388 222v120m352-120v120M413 369h301" fill="none" stroke="#70b8be" stroke-width="3"/>
  <text class="label" x="564" y="216" text-anchor="middle">Inner cloud chamber</text>
  <text class="detail" x="564" y="237" text-anchor="middle">Air, vapor and particles</text>
  <path d="M572 254v10m0-2c-10-11-32-8-21-1 8 4 16 5 21 1m0 0c10-11 32-8 21-1-8 4-16 5-21 1" fill="none" stroke="#5f7885" stroke-width="2"/>
  <text class="tiny" x="605" y="266">Mixing fan</text>
  <g fill="#6faab7" stroke="#287686" stroke-width="1">
    <circle cx="497" cy="290" r="4"/><circle cx="536" cy="308" r="5"/>
    <circle cx="564" cy="283" r="4"/><circle cx="566" cy="328" r="4"/>
    <circle cx="461" cy="316" r="5"/><circle cx="510" cy="340" r="5"/>
  </g>
  <path d="M601 313l9-5 9 5v10l-9 5-9-5Z" fill="#fff" stroke="#286575" stroke-width="1.6"/>
  <path d="M633 281v18m-8-14 16 10m0-10-16 10" stroke="#286575" stroke-width="1.6"/>
  <path d="M680 309v34" fill="none" stroke="#146e78" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text class="tiny" x="664" y="303" text-anchor="middle">Settling</text>

  <!-- Head ports connect to the outer vessel in the source schematic. -->
  <rect x="45" y="119" width="188" height="59" rx="9" fill="#fff5ec" stroke="#c68b69"/>
  <text class="label" x="61" y="143">Air supply</text>
  <text class="detail" x="61" y="164">Ambient or lab fill</text>
  <path d="M234 147h60v-38h141v21" fill="none" stroke="#a6512c" stroke-width="2" marker-end="url(#warm-arrow)"/>
  <rect x="854" y="119" width="242" height="59" rx="9" fill="#eef3f5" stroke="#8fa5ae"/>
  <text class="label" x="870" y="143">Valve and vacuum pump</text>
  <text class="detail" x="870" y="164">Controlled depressurization</text>
  <path class="line" d="M686 128v-19h132v38h35" marker-end="url(#arrow)"/>
  <path d="M458 164v27m221 0v-27" fill="none" stroke="#146e78" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#flow-arrow)"/>

  <text class="label" x="53" y="217">Pressure sensor</text>
  <text class="detail" x="53" y="238">Measured pump history</text>
  <path class="line" d="M239 222h63v4h68"/>
  <circle cx="371" cy="226" r="4" fill="#405766"/>

  <text class="label" x="53" y="276">Temperature probes</text>
  <text class="detail" x="53" y="297">Air and inner walls</text>
  <path class="line" d="M240 270h86v-12h105v18"/>
  <path class="line" d="M326 270v11h44"/>
  <circle cx="431" cy="281" r="5" fill="#ad534f" stroke="#fff" stroke-width="1.2"/>
  <circle cx="376" cy="281" r="5" fill="#ad534f" stroke="#fff" stroke-width="1.2"/>

  <text class="label" x="53" y="353">Cooling system</text>
  <text class="detail" x="53" y="374">Inner-wall coolant</text>
  <path d="M205 357h96v-14h86" fill="none" stroke="#146e78" stroke-width="2" marker-end="url(#flow-arrow)"/>

  <rect x="854" y="233" width="242" height="59" rx="9" fill="#fff5ec" stroke="#c68b69"/>
  <text class="label" x="870" y="257">NaCl powder port</text>
  <text class="detail" x="870" y="278">Salt added after droplet growth</text>
  <path d="M853 263h-60l-42 23h-47" fill="none" stroke="#a6512c" stroke-width="2" marker-end="url(#warm-arrow)"/>

  <!-- Separate vertical optical inlets and the local vapor path. -->
  <path class="line" d="M565 364v47m133-47v47"/>
  <path class="line" d="M428 364v47" stroke-dasharray="4 4"/>
  <circle cx="428" cy="364" r="3.5" fill="#405766"/>
  <circle cx="565" cy="364" r="3.5" fill="#405766"/>
  <circle cx="698" cy="364" r="3.5" fill="#405766"/>
  <g fill="#fff" stroke="#8fa5ae">
    <rect x="366" y="407" width="124" height="55" rx="8"/>
    <rect x="503" y="407" width="124" height="55" rx="8"/>
    <rect x="635" y="407" width="124" height="55" rx="8"/>
  </g>
  <text class="label" x="428" y="429" text-anchor="middle">LI-COR</text>
  <text class="tiny" x="428" y="448" text-anchor="middle">Water vapor</text>
  <text class="label" x="565" y="429" text-anchor="middle">Welas</text>
  <text class="tiny" x="565" y="448" text-anchor="middle">Optical size</text>
  <text class="label" x="697" y="429" text-anchor="middle">CPI</text>
  <text class="tiny" x="697" y="448" text-anchor="middle">Length and habit</text>
  <text class="detail" x="853" y="412">Welas and CPI sample through</text>
  <text class="detail" x="853" y="431">upward-facing inlets below</text>
  <text class="detail" x="853" y="450">the inner chamber.</text>

  <!-- Sequence and four observation streams. -->
  <path d="M35 514h1082" stroke="#d7e0e5" stroke-width="2"/>
  <text class="title" x="35" y="553">B  ·  Experiment sequence and measurements</text>
  <text class="detail" x="36" y="579">Representative salt run · elapsed time increases to the right</text>

  <path d="M282 612H1088" stroke="#405766" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M282 612h114" stroke="#aebdc4" stroke-width="4"/>
  <path d="M396 608v10m118-10v10m164-10v10m157-10v10" stroke="#405766" stroke-width="2"/>
  <path class="guide" d="M396 679v10m118-10v10m164-10v10m157-10v10"/>
  <text class="stage" x="283" y="646">Condition air</text>
  <text class="stage" x="409" y="646">Start expansion</text>
  <text class="stage" x="530" y="646">Droplets grow</text>
  <text class="stage" x="690" y="646">Add salt</text>
  <text class="stage" x="853" y="646">Continue cooling</text>
  <text class="tiny" x="282" y="667">Near 1000 hPa</text>
  <text class="tiny" x="530" y="667">Liquid cloud</text>
  <text class="tiny" x="691" y="667">Large-drop pulse</text>
  <text class="tiny" x="854" y="667">Late ice, where observed</text>
  <text class="tiny" x="1086" y="598" text-anchor="end">~200 hPa target</text>

  <g stroke-width="1">
    <rect x="282" y="692" width="805" height="23" rx="5" fill="#e9eff3" stroke="#a3b5bf"/>
    <rect x="282" y="722" width="805" height="23" rx="5" fill="#e1f0f0" stroke="#88b8b9"/>
    <rect x="282" y="752" width="805" height="23" rx="5" fill="#fff0e7" stroke="#cb9471"/>
    <rect x="282" y="782" width="805" height="23" rx="5" fill="#eef1f8" stroke="#adb8ce"/>
  </g>
  <text class="label" x="44" y="709">Pressure and temperature</text>
  <text class="label" x="44" y="739">LI-COR</text>
  <text class="label" x="44" y="769">Welas</text>
  <text class="label" x="44" y="799">CPI</text>
  <text class="track" x="304" y="709">Pump history, air cooling and wall temperature</text>
  <text class="track" x="304" y="739">Water vapor in runs 1–5 · run 6 lacks usable vapor data</text>
  <text class="track" x="304" y="769">Optical size spectra and the timing of both large-particle pulses</text>
  <text class="track" x="304" y="799">Projected particle lengths and images used to distinguish recognizable ice</text>

  <text class="detail" x="36" y="840">Sequence is schematic. Run 1 has no salt addition. See the experiment table for measured values and clock provenance.</text>
</svg>
