<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Polarization has a large pair effect and a small scan effect</title>
  <desc id="desc">On a common horizontal scale, adding dielectric polarization to the dispersion calculation raises capture by 35.46% for a singly charged 4 nm tracer and a neutral 100 nm collector. The same comparison increases the modeled apparent capture coefficient by 0.064% for the recorded 4 nm chamber scan. The pair icon is schematic.</desc>
  <rect width="300" height="300" rx="16" fill="#fbf2e3"/>
  <g fill="none" stroke="#243e43" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="48" cy="61" r="11" fill="#efd1a5"/>
    <path d="M43 61h10m-5-5v10" stroke="#243e43"/>
    <circle cx="99" cy="53" r="24" fill="#cad9d2"/>
    <path d="M62 60l10-2"/>
  </g>
  <g font-family="sans-serif" fill="#243e43">
    <text x="144" y="76" font-size="15">Capture gain</text>
    <text x="32" y="123" font-size="19" font-weight="bold">Tracer pair</text>
    <text x="32" y="212" font-size="19" font-weight="bold">Chamber scan</text>
  </g>
  <!-- The common baseline is x=36. One percentage point occupies 6 SVG units. -->
  <path d="M36 133v36m0 54v36" fill="none" stroke="#617679" stroke-width="2"/>
  <path d="M36 154H248.76" fill="none" stroke="#135963" stroke-width="7"/>
  <circle cx="248.76" cy="154" r="8" fill="#135963"/>
  <path d="M36 244h.386" fill="none" stroke="#a44d21" stroke-width="7"/>
  <path d="m36.386 237 7 7-7 7-7-7Z" fill="#a44d21"/>
</svg>
