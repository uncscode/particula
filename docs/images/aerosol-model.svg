  <radialGradient id="warm" cx="32%" cy="25%"><stop stop-color="#f8eac2"/><stop offset="1" stop-color="#d1b56b"/></radialGradient>
</defs>
<rect width="560" height="450" fill="#103e3a"/>
<rect width="560" height="450" fill="url(#grid)"/>
