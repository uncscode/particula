<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450" role="img" aria-labelledby="title desc">
<title id="title">An aerosol population</title>
<desc id="desc">A conceptual illustration of particles of different sizes surrounded by smaller gas molecules.</desc>
