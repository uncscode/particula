<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
<title id="title">How run 1 shifted the Manchester campaign mean</title>
<desc id="desc">A schematic of the illuminated aerosol chamber accompanies a zero-centred comparison of the frozen 40-channel and 38-channel fits. Each of the 15 runs has equal weight. Run 1 added 0.588 percentage points to the mean joint error. The other fourteen together subtracted 0.464 points. The net increase of 0.124 points took the mean from 16.35% to 16.47%. Joint error is the larger of the fitted mass and particle count errors.</desc>
<rect width="300" height="300" fill="#FBF2E3"/>
<g transform="translate(-6 -14) scale(1.27)" stroke-linecap="round" stroke-linejoin="round"><path d="M21 39 L45 26 L124 26 L100 39 Z" fill="#EFD1A5" stroke="#243E43" stroke-width="2"/>
<path d="M100 39 L124 26 L124 88 L100 102 Z" fill="#CAD9D2" stroke="#243E43" stroke-width="2"/>
<path d="M21 39 L100 39 L100 102 L21 102 Z" fill="#FBF2E3" stroke="#243E43" stroke-width="2"/>
<path d="M27 44 L32 93 L91 96 L95 44" fill="#CAD9D2" fill-opacity=".51" stroke="#617679" stroke-width="1"/>
<path d="M38 29 L52 22 L104 22 L91 29 Z" fill="#FBF2E3" stroke="#243E43" stroke-width="1.6"/>
<path d="M46 45 l-3 8 M62 45 l-3 8 M78 45 l-3 8" stroke="#A44D21" stroke-width="1.6"/>
<path d="M32 103 v5 M90 103 v5 M119 92 v4" stroke="#243E43" stroke-width="2"/>
<circle cx="39" cy="71" r="2.5" fill="#135963"/>
<circle cx="50" cy="58" r="1.6" fill="#135963"/>
<circle cx="59" cy="79" r="3.2" fill="#135963"/>
<circle cx="70" cy="64" r="2.1" fill="#135963"/>
<circle cx="82" cy="84" r="2.7" fill="#135963"/>
<circle cx="86" cy="57" r="1.5" fill="#135963"/>
<circle cx="46" cy="87" r="1.4" fill="#135963"/>
<circle cx="72" cy="90" r="1.25" fill="#135963"/>
<circle cx="52" cy="68" r="1" fill="#135963"/>
<circle cx="81" cy="73" r="1.1" fill="#135963"/>
</g>
<g font-family="Liberation Sans, Arial, sans-serif" fill="#243E43">
  <g font-size="21" font-weight="bold">
    <text x="159" y="52">Manchester</text>
    <text x="159" y="76">chamber</text>
  </g>
  <text x="160" y="99" font-size="14">38 → 40 channels</text>
  <path d="M16 132H284" stroke="#617679" stroke-width="1"/>
  <text x="16" y="156" font-size="17" font-weight="bold">Change in mean joint error</text>
  <text x="16" y="175" font-size="13">Contribution in percentage points</text>
  <path d="M144 188V248" stroke="#617679" stroke-dasharray="2 2"/>
  <g font-size="14" font-weight="bold">
    <text x="144" y="205" dx="-8" text-anchor="end">Run 1</text>
    <text x="152" y="242">Other 14 runs</text>
  </g>
  <!-- Both arrows start at zero. One percentage point spans 170 units. -->
  <path d="M144 193H236V189L244 199L236 209V205H144Z" fill="#A44D21"/>
  <path d="M144 230H73V226L65.1 236L73 246V242H144Z" fill="#135963"/>
  <g font-size="13" font-weight="bold">
    <text x="248" y="204" fill="#A44D21">+0.59</text>
    <text x="60" y="241" text-anchor="end" fill="#135963">−0.46</text>
  </g>
  <path d="M16 259H284" stroke="#617679" stroke-width="1"/>
  <text x="16" y="282" font-size="14">Campaign mean</text>
  <text x="284" y="282" font-size="20" font-weight="bold" text-anchor="end">16.35% → 16.47%</text>
</g>
</svg>
