<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Cloud droplets over fresh and salt water in the Π Chamber</title>
  <desc id="desc">A droplet denotes cloud number per cubic centimeter. From the fresh-water to the salt-water floor experiment the measured count rises, while a model with humidity fitted separately to each haze population predicts a decline. Both series use the same vertical scale.</desc>
  <rect width="300" height="300" rx="16" fill="#fbf2e3"/>
  <path d="M40 24c-4 9-13 17-13 26a13 13 0 0 0 26 0c0-9-9-17-13-26z" fill="#135963"/>
  <path d="M33 49q0 6 5 8" stroke="#bad5d1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <text x="60" y="55" font-family="sans-serif" font-weight="bold" font-size="20" fill="#233e41">cm⁻³</text>
  <!-- One linear y scale. Fresh/salt measurements: 771/1038. Separate haze fits: 734/462. -->
  <path d="M55 139.8 243 81.0" stroke="#135963" stroke-width="5" fill="none"/>
  <g fill="#135963"><circle cx="55" cy="139.8" r="6"/><circle cx="243" cy="81" r="6"/></g>
  <path d="M55 147.9 243 207.8" stroke="#a45121" stroke-width="4" stroke-dasharray="8 5" fill="none"/>
  <path d="m55 141.9 6 6-6 6-6-6z M243 201.8l6 6-6 6-6-6z" fill="#fbf2e3" stroke="#95431e" stroke-width="3"/>
  <g font-family="sans-serif" font-size="17" font-weight="bold">
    <text x="251" y="65" text-anchor="end" fill="#135963">Measured</text>
    <text x="251" y="169" text-anchor="end" fill="#86401c">Modeled</text>
  </g>
  <path d="M39 238h222 M55 238v6 M243 238v6" fill="none" stroke="#526263" stroke-width="2"/>
  <g fill="#233e41" font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="55" y="271">Freshwater</text>
    <text x="243" y="271">Saltwater</text>
  </g>
</svg>
