<svg xmlns="http://www.w3.org/2000/svg" width="3in"
  height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Earlier arrival improves the next Sea2Cloud count</title>
  <desc id="desc">At 06:30 UTC the ship observed 28 particles/cm³ at
  12–25 nm. The two-hour exchange model predicts 300
  for simultaneous arrival and 36 when the larger particles arrive
  one hour earlier. Both amplitudes were fitted at 06:00.</desc>
  <rect width="300" height="300" rx="16" fill="#fbf2e3"/>
  <g fill="#243e43">
    <path d="M21 39h61l-9 10H31z M36 30h15v9H36z M54 24h10v15H54z
      M57 16h3v8h-3z"/>
    <path d="M20 56q8 4 16 0t16 0t16 0t16 0" fill="none"
      stroke="#617679" stroke-width="2.5"/>
  </g>
  <g fill="#243e43" font-family="sans-serif">
    <text x="100" y="40" font-size="22" font-weight="bold">12–25 nm</text>
    <g font-size="18">
      <text x="25" y="104">Ship</text>
      <text x="25" y="171">Simultaneous</text>
      <text x="25" y="238">Earlier arrival</text>
    </g>
    <path d="M25 111v154" stroke="#617679" stroke-width="1.5"/>
    <rect x="25" y="116"
      width="18.16" height="13" fill="#243e43"/>
    <rect x="25" y="183"
      width="195.00" height="13" fill="#a44d21"/>
    <rect x="25" y="250"
      width="23.12" height="13" fill="#135963"/>
  </g>
</svg>
