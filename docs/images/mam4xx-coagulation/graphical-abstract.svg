<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Neutral attraction reduces sub-100 nm number more with evolving sizes</title>
  <desc id="desc">In the polluted-air simulation at 24 hours, each arrow starts at its own model’s hard-sphere reference. Adding attraction gives 27.91% fewer particles below 100 nm in corrected fixed-width MAM4xx and 38.72% fewer in evolving size sections. Both arrows use the same percentage scale.</desc>
  <rect width="300" height="300" rx="12" fill="#f7f4eb"/>
  <g font-family="sans-serif" fill="#203c42">
    <text x="20" y="37" font-size="19" font-weight="bold">Particles &lt;100 nm · 24 h</text>
    <text x="20" y="81" font-size="15">Hard-sphere reference</text>
    <path d="M20 93H280" stroke="#526569" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Arrow length is 3.15 viewBox units per percentage point. -->
    <path d="M79 93V170" stroke="#96512e" stroke-width="13"/>
    <path d="m65 165 14 15.92L93 165Z" fill="#96512e"/>
    <path d="M217 93V204" stroke="#17646b" stroke-width="13"/>
    <path d="m203 199 14 15.97L231 199Z" fill="#17646b"/>
    <g text-anchor="middle">
      <text x="79" y="210" font-size="25" font-weight="bold">−28%</text>
      <text x="217" y="244" font-size="25" font-weight="bold">−39%</text>
      <text x="79" y="275" font-size="16">Fixed widths</text>
      <text x="217" y="275" font-size="16">Evolving sizes</text>
    </g>
  </g>
</svg>
