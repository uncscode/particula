<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 268" role="img" aria-labelledby="title desc">
  <title id="title">The humid CLOUD reading exceeds the chamber loss bound</title>
  <desc id="desc">At 20 degrees Celsius and 70 percent relative humidity, the low-source measurement was 1,768 ions per cubic centimetre. Even without recombination the linear-loss ceiling was 394. A proposed test clears the chamber, then measures the signal during recovery.</desc>
  <rect width="820" height="268" rx="12" fill="#f5f7f6"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#243849">
    <text x="28" y="38" font-size="23" font-weight="bold">Why are there so many ions in humid air?</text>
    <text x="28" y="66" font-size="16">CERN CLOUD · 20 °C · 70% relative humidity · 2.64 ion pairs cm⁻³ s⁻¹</text>
    <path d="M28 82H792" stroke="#bccbcf"/>
    <text x="28" y="112" font-size="17" font-weight="bold">Measured ions per polarity</text>
    <text x="28" y="140" font-size="15">Chamber</text>
    <text x="28" y="176" font-size="15">Loss ceiling</text>
    <path d="M138 135h194" stroke="#243849" stroke-width="12"/>
    <path d="M138 171h43.2" stroke="#186b80" stroke-width="12"/>
    <text x="342" y="141" font-size="17" font-weight="bold">1,768</text>
    <text x="191" y="177" font-size="17" font-weight="bold" fill="#186b80">394</text>
    <text x="28" y="214" font-size="14">Ions cm⁻³. The ceiling assumes the weakest</text>
    <text x="28" y="235" font-size="14">reported linear loss and zero recombination.</text>
    <path d="M419 99v144" stroke="#bccbcf"/>
    <text x="443" y="112" font-size="17" font-weight="bold">Proposed humid clearing test</text>
    <path d="M448 154H765" stroke="#93a5ac" stroke-width="3"/>
    <circle cx="456" cy="154" r="7" fill="#243849"/>
    <circle cx="589" cy="154" r="7" fill="#186b80"/>
    <circle cx="746" cy="154" r="7" fill="#af4627"/>
    <text x="443" y="188" font-size="15">Clear ions</text>
    <text x="561" y="188" font-size="15">Release</text>
    <text x="706" y="188" font-size="15">Sample</text>
    <text x="443" y="214" font-size="14">Hold 120 s</text>
    <text x="561" y="214" font-size="14">Time zero</text>
    <text x="706" y="214" font-size="14">At 30 s</text>
    <text x="443" y="239" font-size="14">An offset persists while real ions regrow.</text>
  </g>
</svg>
