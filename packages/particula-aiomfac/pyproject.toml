[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "particula-aiomfac"
description = "Pinned AIOMFAC activity reference for Particula"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]

[tool.flit.sdist]
include = ["reference/", "tools/", "tests/"]
exclude = ["**/__pycache__/", "**/*.pyc", ".pytest_cache/"]
