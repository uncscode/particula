[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "particula-aiomfac"
description = "CPU and CUDA AIOMFAC activities for dissolved aerosol mixtures"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.14"]

license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
cuda = ["warp-lang>=1.11"]

[tool.flit.sdist]
include = ["reference/", "tools/", "tests/", "examples/"]
exclude = ["**/__pycache__/", "**/*.pyc", ".pytest_cache/"]

[project.scripts]
particula-aiomfac-table = "particula_aiomfac.sparse:main"
