<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
<title id="title">Aerosol yield and particle sizes in the Manchester ternary mixture</title>
<desc id="desc">Run 24 contains α-pinene, o-cresol and isoprene. At 461 µg/m³ total precursor consumed, the digitized wall-corrected yield is 11.7%. The additive estimate from Voliotis et al.’s single-precursor fits is 16.1% using the run 24 modeled precursor split. The bulk Particula mass-and-number fit gives 13.8%. Separately, at two hours the Manchester number spectrum read from Wang et al. Figure S1a and the Particula refit both peak in the 126–158 nm bin. Both curves use the Particula particle-resolved model. The dashed curve retains the earlier bulk mass-fit chemistry and initial particle parameters. It peaks higher, in the next larger bin. The solid curve refits chemistry and particle parameters using size distributions alongside mass, counts and water uptake. Points are read from the published heatmap, with a contour interval of approximately 5,000 particles per cubic centimetre per decade of diameter. Lines connect model bin means. The refit used this spectrum for calibration.</desc>
