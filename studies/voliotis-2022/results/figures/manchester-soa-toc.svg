<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="3in" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
<title id="title">Measured and modeled post-peak organic aerosol decline in Manchester chamber experiment 16</title>
<desc id="desc">An illuminated aerosol chamber above three bars with a common scale. Suspended secondary organic aerosol fell 30.89 micrograms per cubic metre between the measured peak and last sample. The Particula fit with 20 reaction channels fell 0.32 and the fit with 70 reaction channels fell 13.72.</desc>
